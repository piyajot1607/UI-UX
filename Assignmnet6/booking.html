<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Jindal travels - Booking</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="heading">
    <h1>Jindal Travels</h1>
    <p>Travel your dream destination</p>
  </div>

  <div id="selector">
    <a href="./index.html">Home</a>
    <a href="./pakages.html"> Pakages</a>
    <a href="./booking.html">Booking</a>
    <a href="./gallery.html">Gallery</a>
    <a href="./Contact us.html">Contact us</a>
  </div>

  <div class="form-container">
    <form class="booking-form">
      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Enter your name" required>

      <label for="package-select">Select Package:</label>
      <select id="package-select" required>
        <option value="">-- Select package --</option>
        <!-- populated by script.js -->
      </select>

      <label for="start-date">Check-in (start):</label>
      <input type="date" id="start-date" required>

      <label for="end-date">Check-out (end):</label>
      <input type="date" id="end-date" required>

      <label for="guests">Guests:</label>
      <input type="number" id="guests" min="1" value="1">

      <label for="promo">Promo code:</label>
      <input type="text" id="promo" placeholder="Enter promo code (e.g., EARLYBIRD)">

      <input type="submit" value="Submit">
    </form>

    <div id="estimate-box" class="estimate-box">
      <!-- live estimate populated by script.js -->
      <strong>Estimated total:</strong> — (complete required fields)
    </div>
  </div>

  <script src="./script.js" defer></script>
</body>
</html>
